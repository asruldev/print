<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print RPP02N</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--tx:#1c1917;--mut:#78716c;--bd:#d6d3d1;--ac:#2563eb;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--tx:#fafaf9;--mut:#a8a29e;--bd:#44403c;--ac:#60a5fa;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto;display:grid;gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
p{margin:0;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,monospace;min-height:100px;resize:vertical}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:grid;grid-template-columns:1fr 60px 100px 36px;gap:6px;margin-bottom:6px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 12px}
.menu button{padding:10px 8px;font-size:13px;font-weight:600;background:var(--bg);color:var(--tx);border:1px solid var(--bd);text-align:left;line-height:1.25}
.menu button small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:2px}
.menu button:active{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
#st{font-size:13px;font-weight:600}
.ok{color:var(--ok)}.er{color:var(--er)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font-size:13px;padding:9px 8px}
.hid{display:none}
.check{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:var(--tx)}
.check input{width:auto;accent-color:var(--ac)}
#qbox{margin-top:4px;padding-top:8px;border-top:1px dashed var(--bd)}
#qprev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:var(--bg);border-radius:8px}
#qprev img,#pvq img{width:160px;height:160px;object-fit:contain;background:#fff;padding:6px;border-radius:6px;image-rendering:pixelated}
.meta{font-size:11px;color:var(--mut);text-align:center;line-height:1.35}
.hint{font-size:11px;color:var(--mut);margin-top:6px}
#pvwrap{display:flex;flex-direction:column;align-items:stretch;gap:8px}
#pvq{display:none;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-top:1px dashed var(--bd)}
#pvq.on{display:flex}
#pvq img{width:140px;height:140px}
</style>
</head>
<body>
<div class="w">
  <div class="c">
    <h1>🖨️ Print ke RPP02N</h1>
    <p>Printer thermal 58mm via Bluetooth (BLE). Gunakan Chrome / Edge di Android atau desktop.</p>
    <div class="r" style="margin-top:12px">
      <button id="bc">Hubungkan Printer</button>
      <button id="bd" class="s" disabled>Putuskan</button>
      <span id="st" class="er">Belum terhubung</span>
    </div>
  </div>

  <div class="c">
    <div class="tabs">
      <button id="t1">Struk</button>
      <button id="t2" class="s">Teks Bebas</button>
    </div>

    <div id="p1">
      <label>Nama Toko</label><input id="shop" value="Paduka by Tabusi">
      <label>Alamat / Keterangan</label><input id="addr" value="Bogor">
      <h2 style="margin-top:14px">Menu Jus</h2>
      <div class="menu" id="menu"></div>
      <h2>Pesanan</h2>
      <div id="items"></div>
      <button class="s" id="add">+ Barang lain</button>
      <label>Catatan kaki</label><input id="foot" value="Terima kasih!">

      <label class="check"><input type="checkbox" id="qon" checked> Cetak QRIS di bawah struk</label>
      <div id="qbox">
        <label>Lebar QR di printer (dot)</label>
        <select id="qs">
          <option value="240">240 — kecil</option>
          <option value="280" selected>280 — sedang</option>
          <option value="320">320 — besar</option>
          <option value="360">360 — penuh 58mm</option>
        </select>
        <p class="hint">Sumber: <code>assets/qr.png</code> (tanpa generate ulang).</p>
        <div id="qprev">
          <img id="qimg" src="assets/qr.png" alt="QRIS">
          <div class="meta">assets/qr.png</div>
        </div>
      </div>
    </div>

    <div id="p2" class="hid">
      <label>Teks yang dicetak</label>
      <textarea id="free">Halo dari RPP02N!
Baris 2
Baris 3</textarea>
    </div>

    <div class="r" style="margin-top:14px">
      <button id="pr" disabled>Cetak</button>
      <button id="tst" class="s" disabled>Tes Cetak</button>
    </div>
  </div>

  <div class="c">
    <h2>Pratinjau (32 karakter/baris)</h2>
    <div id="pvwrap">
      <pre id="pv" style="margin:0;font-size:12px;overflow-x:auto"></pre>
      <div id="pvq">
        <img src="assets/qr.png" alt="QRIS">
        <span class="meta">Scan QRIS untuk bayar</span>
      </div>
    </div>
  </div>
</div>

<script>
const W = 32;
const QR_SRC = 'assets/qr.png';
let dev = null, chr = null, tabN = 1, qrImg = null;
const $ = id => document.getElementById(id);

const SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  0xff00, 0xffe0, 0xfee7,
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455'
];

function setSt(t, ok){ $('st').textContent = t; $('st').className = ok ? 'ok' : 'er'; }
function ready(on){ $('pr').disabled = $('tst').disabled = $('bd').disabled = !on; }

async function connect(){
  if(!navigator.bluetooth){ alert('Browser tidak mendukung Web Bluetooth. Pakai Chrome/Edge (Android atau desktop), buka file ini dari HTTPS / localhost.'); return; }
  try{
    setSt('Mencari…', false);
    dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICES });
    dev.addEventListener('gattserverdisconnected', () => { chr = null; ready(false); setSt('Terputus', false); });
    setSt('Menghubungkan…', false);
    const srv = await dev.gatt.connect();
    for(const s of await srv.getPrimaryServices()){
      const w = (await s.getCharacteristics()).find(c => c.properties.write || c.properties.writeWithoutResponse);
      if(w){ chr = w; break; }
    }
    if(!chr) throw new Error('Karakteristik tulis tidak ditemukan');
    ready(true);
    setSt('Terhubung: ' + (dev.name || 'printer'), true);
  }catch(e){
    console.error(e); setSt('Gagal: ' + e.message, false);
  }
}
function disconnect(){ if(dev && dev.gatt.connected) dev.gatt.disconnect(); }

function clean(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e\n]/g,'?'); }
const rp = n => Number(n||0).toLocaleString('id-ID');
function lr(l, r){ l = clean(l); r = clean(r); const sp = W - l.length - r.length; return sp > 0 ? l + ' '.repeat(sp) + r : l.slice(0, W - r.length - 1) + ' ' + r; }
function ctr(s){ s = clean(s); return s.length >= W ? s : ' '.repeat(Math.floor((W - s.length)/2)) + s; }

function qrisOn(){ return tabN === 1 && $('qon').checked; }

function buildStruk(){
  const lines = [];
  lines.push(ctr($('shop').value), ctr($('addr').value), '-'.repeat(W));
  let total = 0;
  document.querySelectorAll('.item').forEach(r => {
    const [n, q, p] = r.querySelectorAll('input');
    const sub = (+q.value||0) * (+p.value||0); total += sub;
    if(!n.value) return;
    lines.push(clean(n.value).slice(0, W));
    lines.push(lr('  ' + (q.value||0) + ' x ' + rp(p.value), rp(sub)));
  });
  lines.push('-'.repeat(W), lr('TOTAL', rp(total)), '-'.repeat(W), ctr($('foot').value));
  return lines;
}

function buildFree(){
  const lines = [];
  clean($('free').value).split('\n').forEach(l => {
    while(l.length > W){ lines.push(l.slice(0, W)); l = l.slice(W); }
    lines.push(l);
  });
  return lines;
}

function buildQrisFooter(){
  return [
    '-'.repeat(W),
    ctr('Bayar dengan QRIS'),
    '', // placeholder gambar QR
    ctr('SATU QRIS UNTUK SEMUA')
  ];
}

function preview(){
  $('qbox').style.display = $('qon').checked ? '' : 'none';
  if(tabN === 1){
    const lines = buildStruk();
    if(qrisOn()){
      lines.push(...buildQrisFooter().map(l => l === '' ? '[ assets/qr.png ]' : l));
      $('pvq').classList.add('on');
    } else {
      $('pvq').classList.remove('on');
    }
    $('pv').textContent = lines.join('\n');
  } else {
    $('pvq').classList.remove('on');
    $('pv').textContent = buildFree().join('\n');
  }
}

/** Muat assets/qr.png sekali */
function loadQrImage(){
  return new Promise((resolve, reject) => {
    if(qrImg && qrImg.complete){ resolve(qrImg); return; }
    const img = new Image();
    img.onload = () => { qrImg = img; resolve(img); };
    img.onerror = () => reject(new Error('Gagal muat ' + QR_SRC));
    img.src = QR_SRC;
  });
}

/** Raster ESC/POS GS v 0 dari gambar mono */
function imageToEscPos(img, targetW){
  const w = Math.max(8, Math.min(384, targetW|0 || 280));
  const h = Math.round(w * (img.height / img.width));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  const { data } = ctx.getImageData(0, 0, w, h);
  const bytesPerRow = Math.ceil(w / 8);
  const body = new Uint8Array(bytesPerRow * h);
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      if(lum < 128) body[y * bytesPerRow + (x >> 3)] |= 0x80 >> (x & 7);
    }
  }
  const out = [];
  // center
  out.push(0x1B, 0x61, 0x01);
  // GS v 0 m=0
  out.push(0x1D, 0x76, 0x30, 0x00,
    bytesPerRow & 0xff, (bytesPerRow >> 8) & 0xff,
    h & 0xff, (h >> 8) & 0xff,
    ...body);
  out.push(0x0A);
  out.push(0x1B, 0x61, 0x00);
  return out;
}

function toBytes(lines){
  const enc = new TextEncoder();
  const out = [0x1B, 0x40];
  lines.forEach(l => { out.push(...enc.encode(l), 0x0A); });
  out.push(0x1B, 0x64, 4);
  return new Uint8Array(out);
}

async function toStrukBytes(){
  const enc = new TextEncoder();
  const out = [0x1B, 0x40];
  const pushLine = l => { out.push(...enc.encode(l), 0x0A); };

  buildStruk().forEach(pushLine);

  if(qrisOn()){
    const img = await loadQrImage();
    const size = +$('qs').value || 280;
    out.push(0x1B, 0x61, 0x01);
    for(const l of buildQrisFooter()){
      if(l === ''){
        out.push(...imageToEscPos(img, size));
      } else {
        pushLine(l);
      }
    }
    out.push(0x1B, 0x61, 0x00);
  }

  out.push(0x1B, 0x64, 4);
  return new Uint8Array(out);
}

async function send(bytes){
  if(!chr) return;
  const size = 100;
  for(let i = 0; i < bytes.length; i += size){
    const part = bytes.slice(i, i + size);
    if(chr.properties.writeWithoutResponse) await chr.writeValueWithoutResponse(part);
    else await chr.writeValue(part);
    await new Promise(r => setTimeout(r, 30));
  }
}

async function doPrint(bytesOrLines){
  try{
    setSt('Mencetak…', true);
    const bytes = bytesOrLines instanceof Uint8Array ? bytesOrLines
      : bytesOrLines instanceof Promise ? await bytesOrLines
      : toBytes(bytesOrLines);
    await send(bytes);
    setSt('Terhubung: ' + (dev.name||'printer'), true);
  }catch(e){
    console.error(e); setSt('Gagal cetak: ' + e.message, false);
  }
}

const MENU = [
  { name: 'Jus Mangga', price: 12000 },
  { name: 'Jus Pisang', price: 10000 },
  { name: 'Jus Alpukat', price: 12000 },
  { name: 'Jus Naga', price: 12000 },
  { name: 'Jus Sirsak', price: 10000 },
  { name: 'Jus Jambu', price: 10000 },
  { name: 'Jus Melon', price: 10000 }
];

function addItem(n='', q=1, p=0){
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = '<input placeholder="Nama" value="'+n+'"><input type="number" min="1" value="'+q+'"><input type="number" min="0" placeholder="Harga" value="'+(p||'')+'"><button class="s" type="button">✕</button>';
  d.querySelector('button').onclick = () => { d.remove(); preview(); };
  d.addEventListener('input', preview);
  $('items').appendChild(d);
  preview();
}

/** Tambah dari menu; kalau item sama sudah ada, qty +1 */
function addFromMenu(name, price){
  for(const r of document.querySelectorAll('.item')){
    const [n, q, p] = r.querySelectorAll('input');
    if(n.value === name && +p.value === price){
      q.value = (+q.value || 0) + 1;
      preview();
      return;
    }
  }
  addItem(name, 1, price);
}

function renderMenu(){
  const box = $('menu');
  box.innerHTML = '';
  MENU.forEach(m => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = m.name + '<small>Rp ' + m.price.toLocaleString('id-ID') + '</small>';
    b.onclick = () => addFromMenu(m.name, m.price);
    box.appendChild(b);
  });
}
renderMenu();

$('add').onclick = () => { addItem(); };
['shop','addr','foot','free'].forEach(id => $(id).addEventListener('input', preview));
$('qs').addEventListener('change', preview);
$('qon').addEventListener('change', preview);
$('bc').onclick = connect;
$('bd').onclick = disconnect;
$('pr').onclick = async () => {
  if(tabN === 1){
    try{
      if(qrisOn()) await loadQrImage();
      doPrint(await toStrukBytes());
    }catch(e){
      alert(e.message || 'Gagal siapkan QRIS');
    }
  } else {
    doPrint(buildFree());
  }
};
$('tst').onclick = () => doPrint([ctr('TES RPP02N'), '-'.repeat(W), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ012345', '0123456789 abcdefghijklmnopqrstuv', '-'.repeat(W), ctr('Printer OK')]);

function tab(n){
  tabN = n;
  $('p1').classList.toggle('hid', n !== 1);
  $('p2').classList.toggle('hid', n !== 2);
  $('t1').className = n === 1 ? '' : 's';
  $('t2').className = n === 2 ? '' : 's';
  preview();
}
$('t1').onclick = () => tab(1);
$('t2').onclick = () => tab(2);
loadQrImage().catch(() => {});
preview();
</script>
</body>
</html>
