<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print RPP02N</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--tx:#1c1917;--mut:#78716c;--bd:#d6d3d1;--ac:#2563eb;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--tx:#fafaf9;--mut:#a8a29e;--bd:#44403c;--ac:#60a5fa;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto;display:grid;gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
p{margin:0;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,monospace;min-height:140px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:grid;grid-template-columns:1fr 60px 100px 36px;gap:6px;margin-bottom:6px}
#st{font-size:13px;font-weight:600}
.ok{color:var(--ok)}.er{color:var(--er)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
.hid{display:none}
</style>
</head>
<body>
<div class="w">
  <div class="c">
    <h1>🖨️ Print ke RPP02N</h1>
    <p>Printer thermal 58mm via Bluetooth (BLE). Gunakan Chrome / Edge di Android atau desktop.</p>
    <div class="r" style="margin-top:12px">
      <button id="bc">Hubungkan Printer</button>
      <button id="bd" class="s" disabled>Putuskan</button>
      <span id="st" class="er">Belum terhubung</span>
    </div>
  </div>

  <div class="c">
    <div class="tabs">
      <button id="t1">Struk</button>
      <button id="t2" class="s">Teks Bebas</button>
    </div>

    <div id="p1">
      <label>Nama Toko</label><input id="shop" value="TOKO SAYA">
      <label>Alamat / Keterangan</label><input id="addr" value="Sawangan, Depok">
      <h2 style="margin-top:14px">Barang</h2>
      <div id="items"></div>
      <button class="s" id="add">+ Tambah barang</button>
      <label>Catatan kaki</label><input id="foot" value="Terima kasih!">
    </div>

    <div id="p2" class="hid">
      <label>Teks yang dicetak</label>
      <textarea id="free">Halo dari RPP02N!
Baris 2
Baris 3</textarea>
    </div>

    <div class="r" style="margin-top:14px">
      <button id="pr" disabled>Cetak</button>
      <button id="tst" class="s" disabled>Tes Cetak</button>
    </div>
  </div>

  <div class="c"><h2>Pratinjau (32 karakter/baris)</h2>
    <pre id="pv" style="margin:0;font-size:12px;overflow-x:auto"></pre></div>
</div>

<script>
const W = 32; // karakter per baris, kertas 58mm
let dev = null, chr = null;
const $ = id => document.getElementById(id);

// UUID layanan umum printer thermal BLE
const SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  0xff00, 0xffe0, 0xfee7,
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455'
];

function setSt(t, ok){ $('st').textContent = t; $('st').className = ok ? 'ok' : 'er'; }
function ready(on){ $('pr').disabled = $('tst').disabled = $('bd').disabled = !on; }

async function connect(){
  if(!navigator.bluetooth){ alert('Browser tidak mendukung Web Bluetooth. Pakai Chrome/Edge (Android atau desktop), buka file ini langsung dari HTTPS atau localhost / file lokal.'); return; }
  try{
    setSt('Mencari…', false);
    dev = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: SERVICES
    });
    dev.addEventListener('gattserverdisconnected', () => { chr = null; ready(false); setSt('Terputus', false); });
    setSt('Menghubungkan…', false);
    const srv = await dev.gatt.connect();
    const list = await srv.getPrimaryServices();
    for(const s of list){
      const chs = await s.getCharacteristics();
      const w = chs.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if(w){ chr = w; break; }
    }
    if(!chr) throw new Error('Karakteristik tulis tidak ditemukan');
    ready(true);
    setSt('Terhubung: ' + (dev.name || 'printer'), true);
  }catch(e){
    console.error(e); setSt('Gagal: ' + e.message, false);
  }
}
function disconnect(){ if(dev && dev.gatt.connected) dev.gatt.disconnect(); }

function clean(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e\n]/g,'?'); }
const rp = n => Number(n||0).toLocaleString('id-ID');
function lr(l, r){ l = clean(l); r = clean(r); const sp = W - l.length - r.length; return sp > 0 ? l + ' '.repeat(sp) + r : l.slice(0, W - r.length - 1) + ' ' + r; }
function ctr(s){ s = clean(s); return s.length >= W ? s : ' '.repeat(Math.floor((W - s.length)/2)) + s; }

// Bangun daftar baris untuk pratinjau + byte untuk printer
function build(){
  const lines = [];
  if(!$('p1').classList.contains('hid')){
    lines.push(ctr($('shop').value), ctr($('addr').value), '-'.repeat(W));
    let total = 0;
    document.querySelectorAll('.item').forEach(r => {
      const [n, q, p] = r.querySelectorAll('input');
      const sub = (+q.value||0) * (+p.value||0); total += sub;
      if(!n.value) return;
      lines.push(clean(n.value).slice(0, W));
      lines.push(lr('  ' + (q.value||0) + ' x ' + rp(p.value), rp(sub)));
    });
    lines.push('-'.repeat(W), lr('TOTAL', rp(total)), '-'.repeat(W), ctr($('foot').value));
  } else {
    clean($('free').value).split('\n').forEach(l => {
      while(l.length > W){ lines.push(l.slice(0, W)); l = l.slice(W); }
      lines.push(l);
    });
  }
  return lines;
}
function preview(){ $('pv').textContent = build().join('\n'); }

function toBytes(lines){
  const enc = new TextEncoder();
  const out = [0x1B, 0x40]; // init
  lines.forEach(l => { out.push(...enc.encode(l), 0x0A); });
  out.push(0x1B, 0x64, 4); // feed 4 baris
  return new Uint8Array(out);
}

async function send(bytes){
  if(!chr) return;
  const size = 100; // jika gagal, turunkan ke 20
  for(let i = 0; i < bytes.length; i += size){
    const part = bytes.slice(i, i + size);
    if(chr.properties.writeWithoutResponse) await chr.writeValueWithoutResponse(part);
    else await chr.writeValue(part);
    await new Promise(r => setTimeout(r, 30));
  }
}

async function doPrint(lines){
  try{ setSt('Mencetak…', true); await send(toBytes(lines)); setSt('Terhubung: ' + (dev.name||'printer'), true); }
  catch(e){ console.error(e); setSt('Gagal cetak: ' + e.message, false); }
}

// UI barang
function addItem(n='', q=1, p=0){
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = '<input placeholder="Nama" value="'+n+'"><input type="number" min="1" value="'+q+'"><input type="number" min="0" placeholder="Harga" value="'+(p||'')+'"><button class="s" type="button">✕</button>';
  d.querySelector('button').onclick = () => { d.remove(); preview(); };
  d.addEventListener('input', preview);
  $('items').appendChild(d);
}
addItem('Kopi susu', 2, 18000); addItem('Roti bakar', 1, 15000);

$('add').onclick = () => { addItem(); preview(); };
['shop','addr','foot','free'].forEach(id => $(id).addEventListener('input', preview));
$('bc').onclick = connect;
$('bd').onclick = disconnect;
$('pr').onclick = () => doPrint(build());
$('tst').onclick = () => doPrint([ctr('TES RPP02N'), '-'.repeat(W), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ012345', '0123456789 abcdefghijklmnopqrstuv', '-'.repeat(W), ctr('Printer OK')]);

function tab(n){
  $('p1').classList.toggle('hid', n !== 1); $('p2').classList.toggle('hid', n !== 2);
  $('t1').className = n === 1 ? '' : 's'; $('t2').className = n === 2 ? '' : 's';
  preview();
}
$('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);
preview();
</script>
</body>
</html>
